<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.json" />
  <title>PHOTO PRO</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f1f3f5; color: #111827; }
    button, input, select { font: inherit; }
    .app { width: 100%; max-width: 430px; min-height: 100vh; margin: 0 auto; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
    .header { padding: 24px 20px 18px; background: #111827; color: white; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .logo { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
    .subtitle { margin-top: 5px; color: #cbd5e1; font-size: 13px; }
    .lang-selector { background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
    .screen { display: none; padding: 20px; flex: 1; overflow-y: auto; }
    .screen.active { display: block; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .description { color: #64748b; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    
    .input { width: 100%; padding: 15px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; font-size: 16px; margin-bottom: 15px;}
    .input:focus { border-color: #2563eb; }
    
    .button { width: 100%; border: 0; border-radius: 12px; padding: 15px; margin-top: 12px; cursor: pointer; font-weight: 700; font-size: 15px; }
    .primary { background: #2563eb; color: white; }
    .primary:disabled { background: #93c5fd; cursor: wait; }
    .secondary { background: #e5e7eb; color: #111827; }
    .success { background: #16a34a; color: white; }
    .whatsapp-btn { background: #25D366; color: white; }
    
    .projects { margin-top: 10px; }
    .project { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px; margin-bottom: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; }
    .project-name { font-weight: 700; }
    .project-info { margin-top: 4px; color: #64748b; font-size: 12px; word-break: break-all; }
    .photo-count { white-space: nowrap; font-weight: 700; color: #2563eb; }
    
    .camera-container { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: #111827; margin-bottom: 10px; }
    #video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .camera-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #94a3b8; text-align: center; padding: 30px; }
    
    .camera-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .camera-controls .button { margin-top: 0; flex: 1; min-width: 120px; }
    .flip-btn { background: #f59e0b; color: #fff; }

    .main-capture-btn { width: 100%; height: 70px; border-radius: 12px; background: #ef4444; border: 2px solid #ffffff; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; font-weight: bold; margin-bottom: 15px;}
    .main-capture-btn:active { transform: scale(0.98); background: #dc2626; }

    .gallery-title { font-weight: 700; margin-top: 10px; margin-bottom: 10px; font-size: 15px; }
    .photo-gallery { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; min-height: 85px; }
    .photo-gallery img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid #cbd5e1; cursor: pointer; }

    .select-all { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #e2e8f0; margin-bottom: 10px; }
    .select-all input, .project-check { width: 20px; height: 20px; }
    .send-project { display: flex; align-items: center; gap: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #e2e8f0; border-radius: 12px; }
    .send-project-info { flex: 1; }
    .send-project-name { font-weight: 700; }
    .send-project-meta { color: #64748b; font-size: 12px; margin-top: 4px; }
    .transfer-options { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    
    .bottom-nav { display: flex; position: sticky; bottom: 0; background: white; border-top: 1px solid #e2e8f0; }
    .nav-button { flex: 1; border: 0; background: white; padding: 14px 8px; cursor: pointer; color: #64748b; font-size: 12px; }
    .nav-button.active { color: #2563eb; font-weight: 700; }
    .nav-icon { display: block; font-size: 20px; margin-bottom: 4px; }
    .empty { text-align: center; padding: 35px 15px; color: #94a3b8; }
    .message { margin-top: 12px; padding: 12px; border-radius: 10px; background: #eff6ff; color: #1e40af; font-size: 13px; display: none; }
    .message.show { display: block; }
    .message.error { background: #fef2f2; color: #991b1b; }
    .message.success { background: #f0fdf4; color: #166534; }

    .photo-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; }
    .photo-modal.show { display: flex; }
    .photo-modal img { max-width: 100%; max-height: 80vh; object-fit: contain; }
    .photo-modal .close-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; background: none; border: none; cursor: pointer; }
    .flash-effect { position: absolute; inset: 0; background: white; opacity: 0; z-index: 10; pointer-events: none; transition: opacity 0.1s; }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div>
      <div class="logo">PHOTO PRO</div>
      <div class="subtitle" data-i18n="subtitle">Local construction site photo management</div>
    </div>
    <select id="langSelector" class="lang-selector" onchange="changeLanguage(this.value)">
      <option value="en">🇬🇧 EN</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="nl">🇳🇱 NL</option>
    </select>
  </header>

  <section id="homeScreen" class="screen active">
    <div class="title" data-i18n="myProjects">My projects</div>
    <input type="text" id="searchInput" class="input" placeholder="🔍 Rechercher par nom ou date..." oninput="renderProjects()" />
    <button class="button primary" onclick="showNewProject()" data-i18n="newProject">+ NEW PROJECT</button>
    <div class="projects"><div id="projectList"></div></div>
  </section>

  <section id="newProjectScreen" class="screen">
    <div class="title" data-i18n="newProjectTitle">New project</div>
    <input id="projectInput" class="input" type="text" placeholder="Ex: AB45821" autocomplete="off" />
    <button class="button primary" onclick="createProject()" data-i18n="startPhotos">📷 START PHOTOS</button>
    <button class="button secondary" onclick="showScreen('homeScreen')" data-i18n="back">Back</button>
    <div id="projectMessage" class="message"></div>
  </section>

  <section id="cameraScreen" class="screen">
    <div class="title" data-i18n="photos">Photos</div>
    <div class="description"><span data-i18n="currentProject">Current project:</span> <strong id="currentProjectName"></strong></div>
    
    <div class="camera-container" id="cameraContainer">
      <video id="video" autoplay playsinline muted></video>
      <div id="cameraPlaceholder" class="camera-placeholder">
        <div style="font-size:45px;">📷</div>
      </div>
      <div id="flashEffect" class="flash-effect"></div>
    </div>

    <button class="main-capture-btn" onclick="takePhoto()">📸 PRENDRE LA PHOTO</button>

    <div class="camera-controls">
      <button id="cameraButton" class="button secondary" onclick="startCamera()" data-i18n="activateCamera">ACTIVER CAMERA</button>
      <button class="button flip-btn" onclick="flipCamera()" data-i18n="flipCamera">🔄 BASCULER</button>
    </div>

    <div class="gallery-title">Photos (<span id="galleryCount">0</span>)</div>
    <div id="photoGallery" class="photo-gallery"></div>

    <button class="button secondary" onclick="finishProject()" data-i18n="finishProject">✓ TERMINER LE PROJET</button>
    <button class="button secondary" onclick="showScreen('homeScreen')" data-i18n="changeProject">Changer de projet</button>
    <div id="cameraMessage" class="message"></div>
  </section>

  <section id="sendScreen" class="screen">
    <div class="title">Envoi vers WhatsApp</div>
    <div class="description">Sélectionnez les projets pour les envoyer.</div>
    
    <div class="select-all">
      <input type="checkbox" id="selectAll" onchange="toggleAllProjects()" />
      <label for="selectAll">Sélectionner tous les projets</label>
    </div>
    
    <div id="sendProjectList"></div>
    
    <div class="transfer-options">
      <div class="date-info" id="transferDateInfo" style="font-size: 13px; color: #64748b;"></div>
    </div>
    
    <button id="btnCreateZip" class="button primary" onclick="preparePhotos()">1. 📥 TÉLÉCHARGER LES PHOTOS</button>
    <button id="btnShareZip" class="button whatsapp-btn" onclick="sharePhotos()" style="display:none;">2. 📤 OUVRIR WHATSAPP</button>
    
    <div id="sendMessage" class="message"></div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-button active" data-screen="homeScreen" onclick="showScreen('homeScreen')">
      <span class="nav-icon">🏠</span><span data-i18n="navHome">Home</span>
    </button>
    <button class="nav-button" data-screen="newProjectScreen" onclick="showNewProject()">
      <span class="nav-icon">➕</span><span data-i18n="navProject">Project</span>
    </button>
    <button class="nav-button" data-screen="sendScreen" onclick="showSendScreen()">
      <span class="nav-icon">📤</span><span data-i18n="navSend">Envoi</span>
    </button>
  </nav>
</div>

<div id="photoModal" class="photo-modal">
  <button class="close-btn" onclick="closePhotoModal()">✕</button>
  <img id="modalImage" src="" alt="Photo" />
</div>

<script>
/* ============== TRADUCTIONS ============== */
const translations = {
  en: {
    subtitle: "Local construction site photo management",
    myProjects: "My projects",
    newProject: "+ NEW PROJECT",
    newProjectTitle: "New project",
    startPhotos: "📷 START PHOTOS",
    back: "Back",
    photos: "Photos",
    currentProject: "Current project:",
    activateCamera: "ACTIVATE CAMERA",
    flipCamera: "🔄 FLIP",
    finishProject: "✓ FINISH PROJECT",
    changeProject: "Change project",
    navHome: "Home",
    navProject: "Project",
    navSend: "Send",
    msgEnterProject: "Enter a project number or name.",
    msgNoProject: "No project selected.",
    msgPhotoSaved: "Photo {n} saved.",
    msgSelectOne: "Select at least one project.",
    msgNoProjects: "No projects yet.",
    msgNoProjectsAvailable: "No projects available.",
    msgLoading: "Preparing...",
    transferDate: "Transfer date: {date}"
  },
  fr: {
    subtitle: "Gestion locale des photos de chantier",
    myProjects: "Mes projets",
    newProject: "+ NOUVEAU PROJET",
    newProjectTitle: "Nouveau projet",
    startPhotos: "📷 COMMENCER",
    back: "Retour",
    photos: "Photos",
    currentProject: "Projet actuel :",
    activateCamera: "ACTIVER CAMERA",
    flipCamera: "🔄 BASCULER",
    finishProject: "✓ TERMINER",
    changeProject: "Changer de projet",
    navHome: "Accueil",
    navProject: "Projet",
    navSend: "Envoi",
    msgEnterProject: "Entre un nom de projet.",
    msgNoProject: "Aucun projet.",
    msgPhotoSaved: "Photo {n} enregistrée.",
    msgSelectOne: "Sélectionne au moins un projet.",
    msgNoProjects: "Aucun projet.",
    msgNoProjectsAvailable: "Aucun projet disponible.",
    msgLoading: "Préparation...",
    transferDate: "Date du transfert : {date}"
  },
  nl: {
    subtitle: "Lokaal beheer van bouwplaatsfoto's",
    myProjects: "Mijn projecten",
    newProject: "+ NIEUW PROJECT",
    newProjectTitle: "Nieuw project",
    startPhotos: "📷 STARTEN",
    back: "Terug",
    photos: "Foto's",
    currentProject: "Huidig project:",
    activateCamera: "CAMERA ACTIVEREN",
    flipCamera: "🔄 WISSELEN",
    finishProject: "✓ VOLTOOIEN",
    changeProject: "Project wijzigen",
    navHome: "Home",
    navProject: "Project",
    navSend: "Verzenden",
    msgEnterProject: "Voer een projectnaam in.",
    msgNoProject: "Geen project.",
    msgPhotoSaved: "Foto {n} opgeslagen.",
    msgSelectOne: "Selecteer minstens één project.",
    msgNoProjects: "Geen projecten.",
    msgNoProjectsAvailable: "Geen projecten beschikbaar.",
    msgLoading: "Voorbereiden...",
    transferDate: "Datum: {date}"
  }
};

let currentLang = localStorage.getItem("photo_pro_lang") || "fr";
let currentScreenId = "homeScreen";

function t(key, vars = {}) {
  let str = translations[currentLang]?.[key] || translations.fr[key] || key;
  for (const [k, v] of Object.entries(vars)) str = str.replace(new RegExp(`\\{${k}\\}`, "g"), v);
  return str;
}

function applyTranslations() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const translated = t(el.dataset.i18n);
    if (translated) el.textContent = translated;
  });
  document.getElementById("langSelector").value = currentLang;
}

function changeLanguage(lang) {
  currentLang = lang;
  localStorage.setItem("photo_pro_lang", lang);
  applyTranslations();
}

/* ============== STATE ============== */
const STORAGE_KEY = "photo_pro_projects";
let projects = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let currentProjectId = null;
let cameraStream = null;
let cameraFacing = "environment";

function saveProjects() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); } 
  catch (e) { alert("Mémoire pleine."); }
}

function showScreen(screenId) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(screenId).classList.add("active");
  document.querySelectorAll(".nav-button").forEach(btn => btn.classList.toggle("active", btn.dataset.screen === screenId));
  currentScreenId = screenId;
  if (screenId === "homeScreen") renderProjects();
  if (screenId === "sendScreen") { renderSendProjects(); updateDateInfo(); }
}

function showNewProject() {
  showScreen("newProjectScreen");
  document.getElementById("projectInput").value = "";
  setTimeout(() => document.getElementById("projectInput").focus(), 100);
}

function renderProjects() {
  const container = document.getElementById("projectList");
  const searchTerm = document.getElementById("searchInput").value.toLowerCase();
  container.innerHTML = "";
  const filtered = projects.filter(p => p.name.toLowerCase().includes(searchTerm) || p.folderName.toLowerCase().includes(searchTerm));
  
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty">${t("msgNoProjects")}</div>`; return;
  }
  filtered.forEach(project => {
    const el = document.createElement("div");
    el.className = "project";
    el.onclick = () => { currentProjectId = project.id; openCameraScreen(); };
    el.innerHTML = `<div><div class="project-name">${project.name}</div><div class="project-info">${project.folderName}</div></div><div class="photo-count">${project.photos} 📸</div>`;
    container.appendChild(el);
  });
}

function createProject() {
  let name = document.getElementById("projectInput").value.trim();
  if (!name) return;
  const now = new Date();
  const date = now.toISOString().slice(0,10);
  const time = now.toTimeString().slice(0,5).replace(":", "-");
  
  const project = {
    id: Date.now(), name: name, folderName: `PROJET_${name}_${date}_${time}`,
    photos: 0, photoData: []
  };
  projects.unshift(project);
  saveProjects();
  currentProjectId = project.id;
  openCameraScreen();
}

async function openCameraScreen() {
  const p = projects.find(x => x.id === currentProjectId);
  document.getElementById("currentProjectName").textContent = p.name;
  renderGallery(p);
  showScreen("cameraScreen");
  if (!cameraStream) startCamera();
}

async function startCamera() {
  const video = document.getElementById("video");
  try {
    if (cameraStream) stopCamera();
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: cameraFacing } }, audio: false });
    video.srcObject = cameraStream;
    video.style.display = "block";
    document.getElementById("cameraPlaceholder").style.display = "none";
  } catch (e) { alert("Erreur Caméra: " + e.name); }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
    document.getElementById("video").style.display = "none";
    document.getElementById("cameraPlaceholder").style.display = "flex";
  }
}

function flipCamera() { cameraFacing = cameraFacing === "environment" ? "user" : "environment"; startCamera(); }

function takePhoto() {
  const p = projects.find(x => x.id === currentProjectId);
  const video = document.getElementById("video");
  if (!p || !cameraStream) return;

  const flash = document.getElementById("flashEffect");
  flash.style.opacity = "0.8";
  setTimeout(() => flash.style.opacity = "0", 150);

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  if (cameraFacing === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0);

  p.photoData.push(canvas.toDataURL("image/jpeg", 0.7));
  p.photos = p.photoData.length;
  saveProjects();
  renderGallery(p);
}

function renderGallery(p) {
  const gallery = document.getElementById("photoGallery");
  document.getElementById("galleryCount").textContent = p.photos;
  gallery.innerHTML = "";
  p.photoData.forEach(url => {
    const img = document.createElement("img");
    img.src = url;
    img.onclick = () => { document.getElementById("modalImage").src = url; document.getElementById("photoModal").classList.add("show"); };
    gallery.appendChild(img);
  });
}

function closePhotoModal() { document.getElementById("photoModal").classList.remove("show"); }
function finishProject() { stopCamera(); showScreen("homeScreen"); }

/* ============== SEND ============== */
function showSendScreen() { showScreen("sendScreen"); renderSendProjects(); updateDateInfo(); }

function renderSendProjects() {
  const container = document.getElementById("sendProjectList");
  container.innerHTML = "";
  projects.forEach(p => {
    container.innerHTML += `
      <div class="send-project">
        <input class="project-check" type="checkbox" value="${p.id}">
        <div class="send-project-info">
          <div class="send-project-name">${p.name}</div>
          <div class="send-project-meta">${p.photos} photos</div>
        </div>
      </div>
    `;
  });
}

function updateDateInfo() {
  document.getElementById("transferDateInfo").textContent = t("transferDate", { date: new Date().toLocaleString() });
}

function toggleAllProjects() {
  const checked = document.getElementById("selectAll").checked;
  document.querySelectorAll(".project-check").forEach(cb => cb.checked = checked);
}
function getSelectedProjects() {
  const checked = Array.from(document.querySelectorAll(".project-check:checked"));
  return checked.map(cb => projects.find(p => p.id === Number(cb.value))).filter(Boolean);
}

/* ============== TRANSFERT & WHATSAPP ============== */
async function preparePhotos() {
  const selected = getSelectedProjects();
  if (selected.length === 0) return alert("Sélectionnez un projet.");

  const btn = document.getElementById("btnCreateZip");
  const originalText = btn.textContent;
  btn.textContent = "Téléchargement en cours...";
  btn.disabled = true;

  try {
    const now = new Date();
    const dateStr = now.toISOString().slice(0,10);
    const timeStr = now.toTimeString().slice(0,5).replace(":", "h");
    
    let count = 0;
    for (const project of selected) {
      project.photoData.forEach((dataUrl, idx) => {
        if (!dataUrl) return;
        
        // Télécharger l'image dans la galerie du téléphone
        const a = document.createElement("a");
        a.href = dataUrl;
        a.download = `${project.name}_${dateStr}_${timeStr}_Photo${String(idx+1).padStart(2,"0")}.jpg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        count++;
      });
    }

    // Préparer le texte pour WhatsApp
    const infoText = `Photos du projet: ${selected.map(p=>p.name).join(", ")}\nDate: ${dateStr}\nHeure: ${timeStr}`;
    window.currentShareText = infoText;

    // Copier automatiquement le texte dans le presse-papiers
    await navigator.clipboard.writeText(infoText);

    // Afficher le bouton WhatsApp
    document.getElementById("btnShareZip").style.display = "block";
    document.getElementById("btnShareZip").textContent = "2. 📤 OUVRIR WHATSAPP";
    
    btn.textContent = "✅ Photos Téléchargées !";
    btn.disabled = false;
    
    alert(`${count} photos ont été enregistrées dans votre galerie.\n\nLe texte (Projet + Date) a été copié. Quand vous serez dans WhatsApp, faites un appui long dans la barre de texte et cliquez sur "Coller".`);

  } catch (error) {
    alert("Erreur : " + error.message);
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

function sharePhotos() {
  // Ouvre WhatsApp
  window.open("https://api.whatsapp.com/send", "_blank");
}
</script>
</body>
</html>
