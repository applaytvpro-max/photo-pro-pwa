<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.json" />
  <title>PHOTO PRO</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f1f3f5; color: #111827; }
    button, input, select { font: inherit; }
    .app { width: 100%; max-width: 430px; min-height: 100vh; margin: 0 auto; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
    
    /* BARRE SUPÉRIEURE & NAVIGATION */
    .top-bar { padding: 15px 20px; background: #111827; color: white; display: flex; align-items: center; gap: 15px; }
    .top-bar .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; display: none; padding: 0; }
    .top-bar .logo { font-size: 20px; font-weight: 800; letter-spacing: 1px; flex: 1; }
    .lang-selector { background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }

    .screen { display: none; padding: 20px; flex: 1; overflow-y: auto; }
    .screen.active { display: block; }
    
    .title { font-size: 22px; font-weight: 700; margin-bottom: 15px; }
    
    .input { width: 100%; padding: 15px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; font-size: 16px; margin-bottom: 15px; }
    .input:focus { border-color: #2563eb; }
    
    .button { width: 100%; border: 0; border-radius: 12px; padding: 15px; margin-top: 12px; cursor: pointer; font-weight: 700; font-size: 15px; }
    .primary { background: #2563eb; color: white; }
    .primary:disabled { background: #93c5fd; cursor: wait; }
    .secondary { background: #e5e7eb; color: #111827; }
    .success { background: #16a34a; color: white; }
    
    /* LISTE DES PROJETS */
    .project { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px; margin-bottom: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; }
    .project:hover { background: #f1f5f9; }
    .project-name { font-weight: 700; font-size: 16px; }
    .project-info { margin-top: 4px; color: #64748b; font-size: 12px; word-break: break-all; }
    .photo-count { white-space: nowrap; font-weight: 700; color: #2563eb; background: #e0f2fe; padding: 4px 8px; border-radius: 6px; font-size: 13px; }
    
    /* CAMERA */
    .camera-container { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: #111827; margin-bottom: 15px; }
    #video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .camera-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #94a3b8; text-align: center; padding: 30px; }
    
    .main-capture-btn { width: 100%; height: 70px; border-radius: 12px; background: #ef4444; border: 2px solid #ffffff; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; font-weight: bold; margin-bottom: 15px;}
    .main-capture-btn:active { transform: scale(0.98); background: #dc2626; }

    .camera-controls { display: flex; gap: 10px; margin-bottom: 20px; }
    .camera-controls button { flex: 1; margin-top: 0; }

    /* GALERIE PHOTOS */
    .gallery-title { font-weight: 700; margin-bottom: 10px; font-size: 15px; }
    .photo-gallery { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; min-height: 85px; }
    .photo-gallery img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid #cbd5e1; cursor: pointer; }

    /* SEND SCREEN */
    .send-project { display: flex; align-items: center; gap: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #e2e8f0; border-radius: 12px; }
    .send-project-info { flex: 1; }
    .send-project-name { font-weight: 700; }
    .transfer-options { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .transfer-options label { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; cursor: pointer; }
    .date-info { font-size: 13px; color: #64748b; margin-top: 8px; padding-top: 8px; border-top: 1px solid #e2e8f0; }
    
    .message { margin-top: 12px; padding: 12px; border-radius: 10px; background: #eff6ff; color: #1e40af; font-size: 13px; display: none; }
    .message.show { display: block; }
    .message.error { background: #fef2f2; color: #991b1b; }
    .message.success { background: #f0fdf4; color: #166534; }

    /* MODAL PHOTO PLEIN ECRAN */
    .photo-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; }
    .photo-modal.show { display: flex; }
    .photo-modal img { max-width: 100%; max-height: 85vh; object-fit: contain; }
    .photo-modal .close-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 35px; background: rgba(255,255,255,0.2); border: none; cursor: pointer; padding: 5px 15px; border-radius: 20px; }
    
    .flash-effect { position: absolute; inset: 0; background: white; opacity: 0; z-index: 10; pointer-events: none; transition: opacity 0.1s; }
    
    @media (min-width: 600px) { body { padding: 30px 0; } .app { min-height: 800px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.12); } }
  </style>
</head>
<body>
<div class="app">
  <header class="top-bar">
    <button class="back-btn" id="globalBackBtn" onclick="handleBack()">◀</button>
    <div class="logo" data-i18n="appTitle">PHOTO PRO</div>
    <select id="langSelector" class="lang-selector" onchange="changeLanguage(this.value)">
      <option value="en">EN</option>
      <option value="fr">FR</option>
      <option value="nl">NL</option>
    </select>
  </header>

  <!-- HOME -->
  <section id="homeScreen" class="screen active">
    <div class="title" data-i18n="myProjects">My Projects</div>
    
    <input type="text" id="searchInput" class="input" placeholder="🔍 Search by name or date..." oninput="renderProjects()" />
    
    <button class="button primary" style="margin-top:0; margin-bottom:20px;" onclick="showNewProject()" data-i18n="btnNewProject">+ NEW PROJECT</button>
    
    <div class="projects"><div id="projectList"></div></div>
  </section>

  <!-- NEW PROJECT -->
  <section id="newProjectScreen" class="screen">
    <div class="title" data-i18n="newProject">New Project</div>
    <input id="projectInput" class="input" type="text" placeholder="Ex: AB45821" autocomplete="off" />
    <button class="button primary" onclick="createProject()" data-i18n="btnCreateOpen">📷 CREATE AND OPEN</button>
    <div id="projectMessage" class="message"></div>
  </section>

  <!-- CAMERA -->
  <section id="cameraScreen" class="screen">
    <div class="title" id="currentProjectName">Project</div>
    
    <div class="camera-container" id="cameraContainer">
      <video id="video" autoplay playsinline muted></video>
      <div id="cameraPlaceholder" class="camera-placeholder">
        <div style="font-size:45px;">📷</div>
      </div>
      <div id="flashEffect" class="flash-effect"></div>
    </div>

    <button class="main-capture-btn" onclick="takePhoto()" data-i18n="btnTakePhoto">📸 TAKE PHOTO</button>

    <div class="camera-controls">
      <button id="cameraButton" class="button secondary" onclick="startCamera()" data-i18n="btnActivateCam">ACTIVATE CAMERA</button>
      <button class="button secondary" onclick="flipCamera()" data-i18n="btnFlip">🔄 FLIP</button>
    </div>

    <div class="gallery-title" data-i18n="photosOfProject">Project photos</div> <span id="galleryCount" style="font-weight:bold; color:#2563eb;">0</span>
    <div id="photoGallery" class="photo-gallery"></div>

    <button class="button success" style="margin-top:20px;" onclick="finishProject()" data-i18n="btnFinishProject">✓ FINISH PROJECT</button>
    <div id="cameraMessage" class="message"></div>
  </section>

  <!-- SEND -->
  <section id="sendScreen" class="screen">
    <div class="title" data-i18n="transferTitle">Transfer</div>
    
    <div style="font-weight:700; margin-bottom:10px;" data-i18n="selectProjects">Select projects:</div>
    <div id="sendProjectList"></div>
    
    <div class="transfer-options">
      <label><input type="radio" name="zipMode" value="zip" checked /> <span data-i18n="groupZip">Group in a ZIP file</span></label>
      <div class="date-info" id="transferDateInfo"></div>
    </div>
    
    <button id="btnCreateZip" class="button primary" onclick="createTransferFile()" data-i18n="btnCreateZip">1. Create ZIP file</button>
    <button id="btnShareZip" class="button success" onclick="shareTransferFile()" style="display:none;" data-i18n="btnShareZip">2. Share (WhatsApp, etc.)</button>
    
    <div id="sendMessage" class="message"></div>
  </section>

  <nav style="display:flex; background:white; border-top:1px solid #e2e8f0;">
    <button class="button secondary" style="border-radius:0; margin:0; padding:15px 5px;" onclick="showScreen('homeScreen')" data-i18n="navHome">🏠 Home</button>
    <button class="button secondary" style="border-radius:0; margin:0; padding:15px 5px;" onclick="showScreen('sendScreen')" data-i18n="navTransfer">📤 Transfer</button>
  </nav>
</div>

<!-- MODAL POUR VOIR LES PHOTOS EN GRAND -->
<div id="photoModal" class="photo-modal">
  <button class="close-btn" onclick="closePhotoModal()" data-i18n="btnClose">✕ Close</button>
  <img id="modalImage" src="" alt="Photo" />
</div>

<script>
/* ============== TRADUCTIONS ============== */
const translations = {
  en: {
    appTitle: "PHOTO PRO",
    myProjects: "My Projects",
    btnNewProject: "+ NEW PROJECT",
    newProject: "New Project",
    btnCreateOpen: "📷 CREATE AND OPEN",
    btnTakePhoto: "📸 TAKE PHOTO",
    btnActivateCam: "ACTIVATE CAMERA",
    btnFlip: "🔄 FLIP",
    photosOfProject: "Project photos:",
    btnFinishProject: "✓ FINISH PROJECT",
    transferTitle: "Transfer",
    selectProjects: "Select projects:",
    groupZip: "Group in a ZIP file",
    btnCreateZip: "1. Create ZIP file",
    btnShareZip: "2. Share (WhatsApp, etc.)",
    navHome: "🏠 Home",
    navTransfer: "📤 Transfer",
    btnClose: "✕ Close",
    searchPlaceholder: "🔍 Search by name or date..."
  },
  fr: {
    appTitle: "PHOTO PRO",
    myProjects: "Mes Projets",
    btnNewProject: "+ NOUVEAU PROJET",
    newProject: "Nouveau Projet",
    btnCreateOpen: "📷 CRÉER ET OUVRIR",
    btnTakePhoto: "📸 PRENDRE LA PHOTO",
    btnActivateCam: "ACTIVER CAMÉRA",
    btnFlip: "🔄 BASCULER",
    photosOfProject: "Photos du projet :",
    btnFinishProject: "✓ TERMINER LE PROJET",
    transferTitle: "Transfert",
    selectProjects: "Sélectionnez les projets :",
    groupZip: "Grouper dans un fichier ZIP",
    btnCreateZip: "1. Créer le fichier ZIP",
    btnShareZip: "2. Partager (WhatsApp, etc.)",
    navHome: "🏠 Accueil",
    navTransfer: "📤 Transfert",
    btnClose: "✕ Fermer",
    searchPlaceholder: "🔍 Rechercher par nom ou date..."
  },
  nl: {
    appTitle: "PHOTO PRO",
    myProjects: "Mijn Projecten",
    btnNewProject: "+ NIEUW PROJECT",
    newProject: "Nieuw Project",
    btnCreateOpen: "📷 AANMAKEN EN OPENEN",
    btnTakePhoto: "📸 FOTO NEMEN",
    btnActivateCam: "CAMERA ACTIVEREN",
    btnFlip: "🔄 WISSELEN",
    photosOfProject: "Projectfoto's:",
    btnFinishProject: "✓ PROJECT VOLTOOIEN",
    transferTitle: "Overdracht",
    selectProjects: "Selecteer projecten:",
    groupZip: "Groeperen in een ZIP-bestand",
    btnCreateZip: "1. ZIP-bestand aanmaken",
    btnShareZip: "2. Delen (WhatsApp, enz.)",
    navHome: "🏠 Home",
    navTransfer: "📤 Overdracht",
    btnClose: "✕ Sluiten",
    searchPlaceholder: "🔍 Zoeken op naam of datum..."
  }
};

let currentLang = localStorage.getItem("photo_pro_lang") || "en";

function applyTranslations() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (translations[currentLang][key]) {
      el.textContent = translations[currentLang][key];
    }
  });
  document.getElementById("searchInput").placeholder = translations[currentLang].searchPlaceholder;
  document.documentElement.lang = currentLang;
  document.getElementById("langSelector").value = currentLang;
}

function changeLanguage(lang) {
  currentLang = lang;
  localStorage.setItem("photo_pro_lang", lang);
  applyTranslations();
}

/* ============== VARIABLES D'ÉTAT ============== */
let projects = JSON.parse(localStorage.getItem("photo_pro_projects") || "[]");
let currentProjectId = null;
let cameraStream = null;
let cameraFacing = "environment"; // Caméra arrière par défaut
let lastGeneratedBlob = null;
let lastGeneratedFilename = null;
let currentScreenId = "homeScreen";

/* ============== NAVIGATION & BOUTON RETOUR ============== */
function showScreen(screenId) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(screenId).classList.add("active");
  currentScreenId = screenId;
  
  const backBtn = document.getElementById("globalBackBtn");
  backBtn.style.display = (screenId === "homeScreen") ? "none" : "block";

  if (screenId === "homeScreen") renderProjects();
  if (screenId === "sendScreen") { renderSendProjects(); updateDateInfo(); }
}

function handleBack() {
  if (currentScreenId === "cameraScreen") stopCamera();
  showScreen("homeScreen");
}

// Intercepter le bouton physique retour d'Android
history.pushState(null, document.title, location.href);
window.addEventListener('popstate', function (event) {
  if (currentScreenId !== "homeScreen") {
    handleBack();
    history.pushState(null, document.title, location.href);
  } else {
    history.back();
  }
});

/* ============== GESTION DES PROJETS & RECHERCHE ============== */
function renderProjects() {
  const container = document.getElementById("projectList");
  const searchTerm = document.getElementById("searchInput").value.toLowerCase();
  container.innerHTML = "";

  const filtered = projects.filter(p => 
    p.name.toLowerCase().includes(searchTerm) || 
    p.folderName.toLowerCase().includes(searchTerm)
  );

  if (filtered.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:20px; color:#64748b;">Aucun projet trouvé.</div>`;
    return;
  }

  filtered.forEach(project => {
    const el = document.createElement("div");
    el.className = "project";
    el.onclick = () => { currentProjectId = project.id; openCameraScreen(); };
    el.innerHTML = `
      <div>
        <div class="project-name">${escapeHTML(project.name)}</div>
        <div class="project-info">${escapeHTML(project.folderName)}</div>
      </div>
      <div class="photo-count">${project.photos} 📸</div>
    `;
    container.appendChild(el);
  });
}

function showNewProject() {
  showScreen("newProjectScreen");
  document.getElementById("projectInput").value = "";
  setTimeout(() => document.getElementById("projectInput").focus(), 100);
}

function createProject() {
  const input = document.getElementById("projectInput");
  let projectName = input.value.trim();
  if (!projectName) return;

  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const timeStr = `${String(now.getHours()).padStart(2,"0")}-${String(now.getMinutes()).padStart(2,"0")}`;
  
  const project = {
    id: Date.now(),
    name: projectName,
    folderName: `PROJET_${projectName}_${dateStr}_${timeStr}`,
    date: dateStr, time: timeStr,
    photos: 0,
    photoData: []
  };
  
  projects.unshift(project);
  saveData();
  input.value = "";
  currentProjectId = project.id;
  openCameraScreen();
}

function saveData() {
  try { localStorage.setItem("photo_pro_projects", JSON.stringify(projects)); } 
  catch (e) { alert("Mémoire pleine. Veuillez transférer et supprimer d'anciens projets."); }
}

/* ============== CAMERA ============== */
async function openCameraScreen() {
  const project = projects.find(p => p.id === currentProjectId);
  if (!project) return;
  document.getElementById("currentProjectName").textContent = project.name;
  renderGallery(project);
  showScreen("cameraScreen");
  if (!cameraStream) startCamera();
}

async function startCamera() {
  const video = document.getElementById("video");
  const placeholder = document.getElementById("cameraPlaceholder");
  try {
    if (cameraStream) stopCamera();
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: cameraFacing } },
      audio: false
    });
    video.srcObject = cameraStream;
    video.style.display = "block";
    placeholder.style.display = "none";
    document.getElementById("cameraButton").textContent = "✅ CAMÉRA ACTIVE";
  } catch (error) {
    alert("Erreur Caméra: " + error.name + ". Vérifiez les permissions.");
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
    document.getElementById("video").style.display = "none";
    document.getElementById("cameraPlaceholder").style.display = "flex";
    document.getElementById("cameraButton").textContent = translations[currentLang].btnActivateCam;
  }
}

function flipCamera() {
  cameraFacing = cameraFacing === "environment" ? "user" : "environment";
  startCamera();
}

function takePhoto() {
  const project = projects.find(p => p.id === currentProjectId);
  const video = document.getElementById("video");
  if (!project || !cameraStream) return;

  const flash = document.getElementById("flashEffect");
  flash.style.opacity = "0.8";
  setTimeout(() => flash.style.opacity = "0", 150);

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  if (cameraFacing === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0);

  project.photoData.push(canvas.toDataURL("image/jpeg", 0.7));
  project.photos = project.photoData.length;
  saveData();
  renderGallery(project);
}

function renderGallery(project) {
  const gallery = document.getElementById("photoGallery");
  document.getElementById("galleryCount").textContent = project.photos;
  gallery.innerHTML = "";
  project.photoData.forEach(url => {
    const img = document.createElement("img");
    img.src = url;
    img.onclick = () => {
      document.getElementById("modalImage").src = url;
      document.getElementById("photoModal").classList.add("show");
    };
    gallery.appendChild(img);
  });
}

function closePhotoModal() { document.getElementById("photoModal").classList.remove("show"); }
function finishProject() { stopCamera(); showScreen("homeScreen"); }

/* ============== TRANSFERT ============== */
function renderSendProjects() {
  const container = document.getElementById("sendProjectList");
  container.innerHTML = "";
  projects.forEach(p => {
    container.innerHTML += `
      <div class="send-project">
        <input class="project-check" type="checkbox" value="${p.id}">
        <div class="send-project-info">
          <div class="send-project-name">${escapeHTML(p.name)}</div>
          <div style="font-size:12px; color:#64748b;">${p.photos} photos</div>
        </div>
      </div>
    `;
  });
}

function updateDateInfo() {
  document.getElementById("transferDateInfo").textContent = "Date: " + new Date().toLocaleString();
}

async function createTransferFile() {
  const selectedIds = Array.from(document.querySelectorAll(".project-check:checked")).map(cb => Number(cb.value));
  if (selectedIds.length === 0) return alert("Sélectionnez au moins un projet.");

  const btn = document.getElementById("btnCreateZip");
  btn.textContent = "Création en cours...";
  btn.disabled = true;

  await new Promise(r => setTimeout(r, 100));

  try {
    const selectedProjects = projects.filter(p => selectedIds.includes(p.id));
    const now = new Date();
    const stamp = now.toISOString().replace(/[:.]/g, "-").slice(0, 19);
    
    const files = [];
    for (const p of selectedProjects) {
      p.photoData.forEach((dataUrl, i) => {
        if (!dataUrl) return;
        const base64 = dataUrl.split(",")[1];
        const bin = atob(base64);
        const arr = new Uint8Array(bin.length);
        for (let j = 0; j < bin.length; j++) arr[j] = bin.charCodeAt(j);
        
        files.push({
          name: `${p.folderName}/photo_${i+1}.jpg`,
          data: arr
        });
      });
    }
    
    const infoText = `TRANSFERT PHOTO PRO\nDate: ${now.toLocaleString()}\nProjets: ${selectedProjects.map(p=>p.name).join(", ")}`;
    files.push({
      name: `INFO_TRANSFERT.txt`,
      data: new TextEncoder().encode(infoText)
    });

    lastGeneratedBlob = await createZipBlob(files);
    lastGeneratedFilename = `PHOTO_PRO_${stamp}.zip`;

    document.getElementById("btnShareZip").style.display = "block";
    document.getElementById("btnShareZip").textContent = translations[currentLang].btnShareZip;
    
    btn.textContent = "✅ Fichier prêt !";
    btn.classList.replace("primary", "secondary");

  } catch (e) {
    alert("Erreur de création : " + e.message);
    btn.textContent = translations[currentLang].btnCreateZip;
    btn.disabled = false;
  }
}

async function shareTransferFile() {
  if (!lastGeneratedBlob) return;
  
  const file = new File([lastGeneratedBlob], lastGeneratedFilename, { type: "application/zip" });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        files: [file],
        title: 'Transfert Photos',
        text: 'Voici les photos du chantier.'
      });
    } catch (e) { console.log("Partage annulé"); }
  } else {
    const url = URL.createObjectURL(lastGeneratedBlob);
    const a = document.createElement("a");
    a.href = url; a.download = lastGeneratedFilename;
    a.click();
    alert("Fichier enregistré dans vos téléchargements.");
  }
}

async function createZipBlob(files) {
  const chunks = [];
  const encoder = new TextEncoder();
  const centralDir = [];
  let offset = 0;
  
  function crc32(data) {
    let crc = 0xFFFFFFFF;
    const table = crc32.table || (crc32.table = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c; } return t; })());
    for (let i = 0; i < data.length; i++) crc = table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  for (const file of files) {
    const nameBytes = encoder.encode(file.name);
    const data = file.data;
    const crc = crc32(data);
    const now = new Date();
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const lh = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0, true); lv.setUint16(8, 0, true); lv.setUint16(10, dosTime, true); lv.setUint16(12, dosDate, true); lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true); lv.setUint16(26, nameBytes.length, true); lh.set(nameBytes, 30);
    chunks.push(lh, data);
    centralDir.push({ nameBytes, crc, size: data.length, offset, dosTime, dosDate });
    offset += lh.length + data.length;
  }

  const cdStart = offset;
  for (const entry of centralDir) {
    const ch = new Uint8Array(46 + entry.nameBytes.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0, true); cv.setUint16(10, 0, true); cv.setUint16(12, entry.dosTime, true); cv.setUint16(14, entry.dosDate, true); cv.setUint32(16, entry.crc, true); cv.setUint32(20, entry.size, true); cv.setUint32(24, entry.size, true); cv.setUint16(28, entry.nameBytes.length, true); cv.setUint32(42, entry.offset, true); ch.set(entry.nameBytes, 46);
    chunks.push(ch);
    offset += ch.length;
  }

  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, centralDir.length, true); ev.setUint16(10, centralDir.length, true); ev.setUint32(12, offset - cdStart, true); ev.setUint32(16, cdStart, true);
  chunks.push(eocd);
  return new Blob(chunks, { type: "application/zip" });
}

function escapeHTML(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

applyTranslations();
